version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      cooldown:
          default-days: 7
      schedule:
          interval: daily
      commit-message:
          prefix: "[npm]"
      groups:
          npm-patch:
              update-types: ["patch"]
          npm-minor:
              update-types: ["minor"]

    - package-ecosystem: "github-actions"
      directory: "/"
      cooldown:
        default-days: 7
      schedule:
          interval: daily
      commit-message:
          prefix: "[gha]"
      groups:
          gha-patch:
              update-types: ["patch"]
          gha-minor:
              update-types: ["minor"]

    - package-ecosystem: "docker"
      directory: "/"
      cooldown:
        default-days: 7
      schedule:
          interval: daily
      commit-message:
          prefix: "[docker]"
      groups:
          docker-patch:
              update-types: ["patch"]
          docker-minor:
              update-types: ["minor"]
      # We had stability issues with Next 14 and Node 22.
      # When we do make the jump, please remove this kommentar.
      ignore:
          - dependency-name: "node"
            versions: [">=22.0.0"]
