version: 2
registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    scope: "@navikt"
    token: ${{ secrets.READER_TOKEN }}
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: daily
      registries:
        - npm-github
      groups:
          patch-dependencies:
              patterns:
                  - "*"
              update-types:
                  - "patch"
          minor-dependencies:
              patterns:
                  - "*"
              update-types:
                  - "minor"
      commit-message:
          prefix: "[npm]"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: daily
      commit-message:
          prefix: "[gha]"

    - package-ecosystem: "docker"
      directory: "/"
      schedule:
          interval: daily
      commit-message:
          prefix: "[docker]"
      # We had stability issues with Next 14 and Node 22.
      # When we do make the jump, please remove this kommentar.
      ignore:
          - dependency-name: "node"
            versions: [">=22.0.0"]
